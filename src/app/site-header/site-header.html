<header class="header" [class.is-open]="open()">
  <div class="bar">
    <a class="logo" [href]="copy().home" [attr.aria-label]="copy().homeLabel" (click)="close()">
      <img src="/skooltrak-logo.svg" alt="Skooltrak" />
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="site-menu"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="open() ? copy().closeMenu : copy().openMenu"
      (click)="toggle()"
    >
      @if (open()) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      }
    </button>

    <div class="menu" id="site-menu">
      <nav class="nav" [attr.aria-label]="copy().navLabel">
        @for (link of copy().links; track link.href) {
          <a [href]="link.href" (click)="close()">{{ link.label }}</a>
        }
      </nav>
      <div class="actions">
        <a class="lang" [href]="copy().switchHref" [attr.lang]="copy().switchLang" [attr.aria-label]="copy().switchLabel">{{ copy().switchText }}</a>
        <a class="sign-in" href="https://app.skooltrak.com" (click)="close()">{{ copy().signIn }}</a>
        <a class="demo" [href]="lang() === 'en' ? '/en#demo' : '/#demo'" (click)="close()">{{ copy().demo }}</a>
      </div>
    </div>
  </div>
</header>
